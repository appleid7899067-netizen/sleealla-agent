services:
  app:
    build:
      context: .
      target: app
    ports:
      - "8080:8080"
    environment:
      - MCP_GATEWAY_URL=http://mcp-gateway:8811
      - QUESTION=${QUESTION:-Does SlieQwenBoss Lo8 support MCP tool routing?}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://model-runner:12434/v1}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-ai/gemma3-qat}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-cannot_be_empty}
    depends_on:
      - mcp-gateway
    models:
      gemma:
        endpoint_var: MODEL_RUNNER_URL
        model_var: MODEL_RUNNER_MODEL

  mcp-gateway:
    image: docker/mcp-gateway:latest
    use_api_socket: true
    ports:
      - "8811:8811"
    command:
      - --transport=sse
      - --servers=duckduckgo
      - --tools=search,fetch_content

models:
  gemma:
    model: ai/gemma3-qat
